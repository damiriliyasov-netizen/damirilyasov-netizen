<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Изометрическая комната подростка</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button {
            display: block;
            margin: 5px 0;
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            background: #4a90e2;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        button:hover {
            background: #357abd;
        }
        button.active {
            background: #2ecc71;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="controls">
        <h3 style="margin-top:0;">Управление стенами:</h3>
        <button id="allWalls" class="active">Все 4 стены</button>
        <button id="backWall">Только задняя стена</button>
        <button id="floorOnly">Только пол</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Сцена
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        // Камера (изометрическая)
        const aspect = window.innerWidth / window.innerHeight;
        const frustumSize = 15;
        const camera = new THREE.OrthographicCamera(
            frustumSize * aspect / -2,
            frustumSize * aspect / 2,
            frustumSize / 2,
            frustumSize / -2,
            0.1,
            1000
        );
        camera.position.set(10, 10, 10);
        camera.lookAt(0, 0, 0);

        // Рендерер
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Управление камерой
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = true;

        // Освещение
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
        directionalLight.position.set(10, 15, 10);
        directionalLight.castShadow = true;
        directionalLight.shadow.camera.left = -20;
        directionalLight.shadow.camera.right = 20;
        directionalLight.shadow.camera.top = 20;
        directionalLight.shadow.camera.bottom = -20;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);

        // Группа для стен
        const wallsGroup = new THREE.Group();
        scene.add(wallsGroup);

        // Размеры комнаты
        const roomWidth = 8;
        const roomDepth = 8;
        const roomHeight = 4;

        // Материалы
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
        const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x90EE90, side: THREE.DoubleSide, roughness: 0.9 });
        const ceilingMaterial = new THREE.MeshStandardMaterial({ color: 0x222222 });

        // Пол
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(roomWidth, roomDepth),
            floorMaterial
        );
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Стены
        const backWall = new THREE.Mesh(
            new THREE.PlaneGeometry(roomWidth, roomHeight),
            wallMaterial
        );
        backWall.position.set(0, roomHeight / 2, -roomDepth / 2);
        backWall.castShadow = true;
        backWall.receiveShadow = true;
        wallsGroup.add(backWall);

        const leftWall = new THREE.Mesh(
            new THREE.PlaneGeometry(roomDepth, roomHeight),
            wallMaterial
        );
        leftWall.position.set(-roomWidth / 2, roomHeight / 2, 0);
        leftWall.rotation.y = Math.PI / 2;
        leftWall.castShadow = true;
        leftWall.receiveShadow = true;
        wallsGroup.add(leftWall);

        const rightWall = new THREE.Mesh(
            new THREE.PlaneGeometry(roomDepth, roomHeight),
            wallMaterial
        );
        rightWall.position.set(roomWidth / 2, roomHeight / 2, 0);
        rightWall.rotation.y = -Math.PI / 2;
        rightWall.castShadow = true;
        rightWall.receiveShadow = true;
        wallsGroup.add(rightWall);

        const frontWall = new THREE.Mesh(
            new THREE.PlaneGeometry(roomWidth, roomHeight),
            wallMaterial
        );
        frontWall.position.set(0, roomHeight / 2, roomDepth / 2);
        frontWall.rotation.y = Math.PI;
        frontWall.castShadow = true;
        frontWall.receiveShadow = true;
        wallsGroup.add(frontWall);

        // Потолок
        const ceiling = new THREE.Mesh(
            new THREE.PlaneGeometry(roomWidth, roomDepth),
            ceilingMaterial
        );
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.y = roomHeight;
        wallsGroup.add(ceiling);

        // Функция создания мебели
        function createBed() {
            const bedGroup = new THREE.Group();
            
            const base = new THREE.Mesh(
                new THREE.BoxGeometry(2.2, 0.4, 3.2),
                new THREE.MeshStandardMaterial({ color: 0x111111 })
            );
            base.position.y = 0.2;
            base.castShadow = true;
            base.receiveShadow = true;
            bedGroup.add(base);

            const mattress = new THREE.Mesh(
                new THREE.BoxGeometry(2, 0.3, 3),
                new THREE.MeshStandardMaterial({ color: 0x39FF14, emissive: 0x114400, emissiveIntensity: 0.2 })
            );
            mattress.position.y = 0.55;
            mattress.castShadow = true;
            mattress.receiveShadow = true;
            bedGroup.add(mattress);

            const headboard = new THREE.Mesh(
                new THREE.BoxGeometry(2.2, 1.5, 0.1),
                new THREE.MeshStandardMaterial({ color: 0x111111 })
            );
            headboard.position.set(0, 1, -1.5);
            headboard.castShadow = true;
            headboard.receiveShadow = true;
            bedGroup.add(headboard);

            const pillow = new THREE.Mesh(
                new THREE.BoxGeometry(1.5, 0.2, 0.6),
                new THREE.MeshStandardMaterial({ color: 0x39FF14 })
            );
            pillow.position.set(0, 0.8, -1);
            pillow.castShadow = true;
            pillow.receiveShadow = true;
            bedGroup.add(pillow);

            return bedGroup;
        }

        function createDesk() {
            const deskGroup = new THREE.Group();

            const top = new THREE.Mesh(
                new THREE.BoxGeometry(2, 0.1, 1),
                new THREE.MeshStandardMaterial({ color: 0x222222 })
            );
            top.position.y = 1;
            top.castShadow = true;
            top.receiveShadow = true;
            deskGroup.add(top);

            const legGeometry = new THREE.BoxGeometry(0.1, 1, 0.1);
            const legMaterial = new THREE.MeshStandardMaterial({ color: 0x111111 });

            const leg1 = new THREE.Mesh(legGeometry, legMaterial);
            leg1.position.set(-0.9, 0.5, -0.4);
            leg1.castShadow = true;
            deskGroup.add(leg1);

            const leg2 = new THREE.Mesh(legGeometry, legMaterial);
            leg2.position.set(0.9, 0.5, -0.4);
            leg2.castShadow = true;
            deskGroup.add(leg2);

            const leg3 = new THREE.Mesh(legGeometry, legMaterial);
            leg3.position.set(-0.9, 0.5, 0.4);
            leg3.castShadow = true;
            deskGroup.add(leg3);

            const leg4 = new THREE.Mesh(legGeometry, legMaterial);
            leg4.position.set(0.9, 0.5, 0.4);
            leg4.castShadow = true;
            deskGroup.add(leg4);

            return deskGroup;
        }

        function createChair() {
            const chairGroup = new THREE.Group();

            const seat = new THREE.Mesh(
                new THREE.BoxGeometry(0.8, 0.1, 0.8),
                new THREE.MeshStandardMaterial({ color: 0x111111 })
            );
            seat.position.y = 0.6;
            seat.castShadow = true;
            seat.receiveShadow = true;
            chairGroup.add(seat);

            const back = new THREE.Mesh(
                new THREE.BoxGeometry(0.8, 0.8, 0.1),
                new THREE.MeshStandardMaterial({ color: 0x111111 })
            );
            back.position.set(0, 1, -0.35);
            back.castShadow = true;
            back.receiveShadow = true;
            chairGroup.add(back);

            const accent = new THREE.Mesh(
                new THREE.BoxGeometry(0.6, 0.1, 0.12),
                new THREE.MeshStandardMaterial({ color: 0x39FF14, emissive: 0x39FF14, emissiveIntensity: 0.3 })
            );
            accent.position.set(0, 1, -0.35);
            chairGroup.add(accent);

            const legGeometry = new THREE.BoxGeometry(0.08, 0.6, 0.08);
            const legMaterial = new THREE.MeshStandardMaterial({ color: 0x111111 });

            const positions = [[-0.35, 0.3, -0.35], [0.35, 0.3, -0.35], [-0.35, 0.3, 0.35], [0.35, 0.3, 0.35]];
            positions.forEach(pos => {
                const leg = new THREE.Mesh(legGeometry, legMaterial);
                leg.position.set(...pos);
                leg.castShadow = true;
                chairGroup.add(leg);
            });

            return chairGroup;
        }

        function createComputer() {
            const computerGroup = new THREE.Group();

            const screenLight = new THREE.PointLight(0x00FFFF, 2, 5);
            screenLight.position.set(0, 1.3, 0.5);
            computerGroup.add(screenLight);

            const monitor = new THREE.Mesh(
                new THREE.BoxGeometry(0.8, 0.5, 0.05),
                new THREE.MeshStandardMaterial({ color: 0x111111 })
            );
            monitor.position.y = 1.3;
            monitor.castShadow = true;
            computerGroup.add(monitor);

            const screen = new THREE.Mesh(
                new THREE.BoxGeometry(0.7, 0.4, 0.01),
                new THREE.MeshStandardMaterial({ 
                    color: 0x00FFFF, 
                    emissive: 0x00FFFF, 
                    emissiveIntensity: 0.8 
                })
            );
            screen.position.set(0, 1.3, 0.03);
            computerGroup.add(screen);

            const stand = new THREE.Mesh(
                new THREE.BoxGeometry(0.1, 0.3, 0.1),
                new THREE.MeshStandardMaterial({ color: 0x111111 })
            );
            stand.position.set(0, 1.05, 0);
            stand.castShadow = true;
            computerGroup.add(stand);

            const keyboard = new THREE.Mesh(
                new THREE.BoxGeometry(0.5, 0.02, 0.2),
                new THREE.MeshStandardMaterial({ 
                    color: 0x111111,
                    emissive: 0x39FF14,
                    emissiveIntensity: 0.4
                })
            );
            keyboard.position.set(0, 1.06, 0.3);
            keyboard.castShadow = true;
            computerGroup.add(keyboard);

            return computerGroup;
        }

        function createBookshelf() {
            const shelfGroup = new THREE.Group();

            for (let i = 0; i < 4; i++) {
                const shelf = new THREE.Mesh(
                    new THREE.BoxGeometry(1.5, 0.05, 0.4),
                    new THREE.MeshStandardMaterial({ color: 0x111111 })
                );
                shelf.position.y = i * 0.8;
                shelf.castShadow = true;
                shelf.receiveShadow = true;
                shelfGroup.add(shelf);
            }

            const sideGeometry = new THREE.BoxGeometry(0.05, 3.2, 0.4);
            const sideMaterial = new THREE.MeshStandardMaterial({ color: 0x111111 });

            const leftSide = new THREE.Mesh(sideGeometry, sideMaterial);
            leftSide.position.set(-0.75, 1.6, 0);
            leftSide.castShadow = true;
            leftSide.receiveShadow = true;
            shelfGroup.add(leftSide);

            const rightSide = new THREE.Mesh(sideGeometry, sideMaterial);
            rightSide.position.set(0.75, 1.6, 0);
            rightSide.castShadow = true;
            rightSide.receiveShadow = true;
            shelfGroup.add(rightSide);

            const bookColors = [0xe74c3c, 0x3498db, 0xf39c12, 0x9b59b6, 0x1abc9c];
            for (let shelf = 0; shelf < 3; shelf++) {
                for (let i = 0; i < 5; i++) {
                    const book = new THREE.Mesh(
                        new THREE.BoxGeometry(0.15, 0.4 + Math.random() * 0.2, 0.3),
                        new THREE.MeshStandardMaterial({ color: bookColors[i % bookColors.length] })
                    );
                    book.position.set(-0.5 + i * 0.25, shelf * 0.8 + 0.25, 0);
                    book.castShadow = true;
                    book.receiveShadow = true;
                    shelfGroup.add(book);
                }
            }

            return shelfGroup;
        }

        function createPoster() {
            const poster = new THREE.Mesh(
                new THREE.PlaneGeometry(1, 1.5),
                new THREE.MeshStandardMaterial({ 
                    color: 0xff6b6b,
                    side: THREE.DoubleSide
                })
            );
            poster.castShadow = true;
            poster.receiveShadow = true;
            return poster;
        }

        function createLamp() {
            const lampGroup = new THREE.Group();

            const base = new THREE.Mesh(
                new THREE.CylinderGeometry(0.15, 0.2, 0.05),
                new THREE.MeshStandardMaterial({ color: 0x111111 })
            );
            base.position.y = 1.025;
            base.castShadow = true;
            base.receiveShadow = true;
            lampGroup.add(base);

            const stand = new THREE.Mesh(
                new THREE.CylinderGeometry(0.02, 0.02, 0.4),
                new THREE.MeshStandardMaterial({ color: 0x111111 })
            );
            stand.position.y = 1.25;
            stand.castShadow = true;
            lampGroup.add(stand);

            const shade = new THREE.Mesh(
                new THREE.ConeGeometry(0.2, 0.25, 16),
                new THREE.MeshStandardMaterial({ color: 0x39FF14, emissive: 0x39FF14, emissiveIntensity: 0.5 })
            );
            shade.position.y = 1.55;
            shade.rotation.x = Math.PI;
            shade.castShadow = true;
            shade.receiveShadow = true;
            lampGroup.add(shade);

            const lampLight = new THREE.PointLight(0x39FF14, 1.5, 4);
            lampLight.position.set(0, 1.4, 0);
            lampGroup.add(lampLight);

            return lampGroup;
        }

        function createRug() {
            const rug = new THREE.Mesh(
                new THREE.CircleGeometry(1.5, 32),
                new THREE.MeshStandardMaterial({ 
                    color: 0x39FF14,
                    emissive: 0x39FF14,
                    emissiveIntensity: 0.3
                })
            );
            rug.rotation.x = -Math.PI / 2;
            // ИСПРАВЛЕНИЕ 2: Приподнял ковер на 0.02, чтобы избежать мерцания (z-fighting) с полом
            rug.position.y = 0.02;
            rug.receiveShadow = true;
            return rug;
        }

        function createNeonText(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = 'rgba(0,0,0,0)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.shadowColor = '#39FF14';
            ctx.shadowBlur = 30;
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 100px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);

            ctx.shadowBlur = 15;
            ctx.strokeStyle = '#39FF14';
            ctx.lineWidth = 4;
            ctx.strokeText(text, canvas.width / 2, canvas.height / 2);

            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.MeshBasicMaterial({
                map: texture,
                transparent: true,
                side: THREE.DoubleSide,
                blending: THREE.AdditiveBlending
            });
            
            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(4, 2), material);
            return mesh;
        }

        // Размещение мебели
        const bed = createBed();
        bed.position.set(-2.5, 0, -2.5);
        scene.add(bed);

        const desk = createDesk();
        desk.position.set(2.5, 0, -3);
        scene.add(desk);

        const chair = createChair();
        chair.position.set(2.5, 0, -2);
        // ИСПРАВЛЕНИЕ 1: Разворачиваем стул лицом к столу (на 180 градусов)
        chair.rotation.y = Math.PI;
        scene.add(chair);

        const computer = createComputer();
        computer.position.set(2.5, 0, -3);
        scene.add(computer);

        const bookshelf = createBookshelf();
        bookshelf.position.set(-3.5, 0, 2);
        bookshelf.rotation.y = Math.PI / 2;
        scene.add(bookshelf);

        // ИСПРАВЛЕНИЕ 3: Сдвигаем постер вправо, чтобы он не торчал красным пятном из-за неоновой надписи по центру
        const poster1 = createPoster();
        poster1.position.set(2.5, 2.5, -3.95);
        scene.add(poster1);

        const poster2 = createPoster();
        poster2.position.set(-3.95, 2.5, 0);
        poster2.rotation.y = Math.PI / 2;
        scene.add(poster2);

        const lamp = createLamp();
        lamp.position.set(3.5, 0, -3);
        scene.add(lamp);

        const rug = createRug();
        rug.position.set(0, 0, 0);
        scene.add(rug);

        // ИСПРАВЛЕНИЕ 4: Меняем текст на ARTEM
        const neonSign = createNeonText('ARTEM');
        neonSign.position.set(0, 2.5, -3.9);
        scene.add(neonSign);

        // Управление видимостью стен
        const allWallsBtn = document.getElementById('allWalls');
        const backWallBtn = document.getElementById('backWall');
        const floorOnlyBtn = document.getElementById('floorOnly');

        function setActiveButton(activeBtn) {
            [allWallsBtn, backWallBtn, floorOnlyBtn].forEach(btn => btn.classList.remove('active'));
            activeBtn.classList.add('active');
        }

        allWallsBtn.addEventListener('click', () => {
            wallsGroup.visible = true;
            backWall.visible = true;
            leftWall.visible = true;
            rightWall.visible = true;
            frontWall.visible = true;
            ceiling.visible = true;
            floor.visible = true;
            neonSign.visible = true;
            setActiveButton(allWallsBtn);
        });

        backWallBtn.addEventListener('click', () => {
            wallsGroup.visible = true;
            backWall.visible = true;
            leftWall.visible = false;
            rightWall.visible = false;
            frontWall.visible = false;
            ceiling.visible = false;
            floor.visible = true;
            neonSign.visible = true;
            setActiveButton(backWallBtn);
        });

        floorOnlyBtn.addEventListener('click', () => {
            wallsGroup.visible = false;
            floor.visible = true;
            neonSign.visible = false;
            setActiveButton(floorOnlyBtn);
        });

        // Анимация
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Обработка изменения размера окна
        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = frustumSize * aspect / -2;
            camera.right = frustumSize * aspect / 2;
            camera.top = frustumSize / 2;
            camera.bottom = frustumSize / -2;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
